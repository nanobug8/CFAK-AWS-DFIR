AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  C-FAK Core - Portable AWS DFIR Infrastructure.
  Does NOT create, attach, replace or assume any IAM role on the victim EC2.
  Trigger: EC2 Tag Change on Resource (Forensic=True) -> Lambda -> ECS Fargate.

Parameters:
  ProjectName:
    Type: String
    Default: c-fak
    AllowedPattern: '^[a-z0-9-]+$'

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC where the Fargate task will run.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing PUBLIC subnet with route to an Internet Gateway. Fargate receives a public IP.

  DockerImageUri:
    Type: String
    Default: nanobug8/cfak:latest
    Description: Public Docker image containing the C-FAK forensic controller.

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-evidence-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: EvidenceLifecycle
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 30
            ExpirationInDays: 365

  ForensicLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-forensic-task'
      RetentionInDays: 14

  FargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} Fargate forensic controller'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-fargate-sg'

  ForensicCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-Cluster'

  FargateExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  FargateTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: C-FAK-SSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SendSSMCommand
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'

        - PolicyName: C-FAK-EC2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DescribeInstances
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                Resource: '*'
              - Sid: SnapshotOperations
                Effect: Allow
                Action:
                  - ec2:CreateSnapshot
                  - ec2:CreateTags
                Resource: '*'

        - PolicyName: C-FAK-S3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EvidenceBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt EvidenceBucket.Arn
              - Sid: EvidenceObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${EvidenceBucket.Arn}/*'

  ForensicTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-Task'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt FargateExecutionRole.Arn
      TaskRoleArn: !GetAtt FargateTaskRole.Arn
      ContainerDefinitions:
        - Name: forensic-controller
          Image: !Ref DockerImageUri
          Essential: true
          Environment:
            - Name: TARGET_BUCKET
              Value: !Ref EvidenceBucket
            - Name: PROJECT_NAME
              Value: !Ref ProjectName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ForensicLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: forensic

  LambdaOrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        - PolicyName: RunForensicTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunTask
                Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref ForensicTaskDefinition
              - Sid: PassFargateRoles
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt FargateExecutionRole.Arn
                  - !GetAtt FargateTaskRole.Arn

  OrchestratorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-Orchestrator'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt LambdaOrchestratorRole.Arn
      Environment:
        Variables:
          CLUSTER_NAME: !Ref ForensicCluster
          TASK_DEFINITION: !Ref ForensicTaskDefinition
          SUBNET_ID: !Ref SubnetId
          SECURITY_GROUP_ID: !GetAtt FargateSecurityGroup.GroupId
      Code:
        ZipFile: |
          import json
          import os
          import re
          import boto3

          ecs = boto3.client('ecs')

          CLUSTER_NAME = os.environ['CLUSTER_NAME']
          TASK_DEFINITION = os.environ['TASK_DEFINITION']
          SUBNET_ID = os.environ['SUBNET_ID']
          SECURITY_GROUP_ID = os.environ['SECURITY_GROUP_ID']

          def handler(event, context):
              print('================================================')
              print('C-FAK ORCHESTRATOR')
              print('================================================')
              print('EVENT:')
              print(json.dumps(event, indent=2, default=str))

              detail = event.get('detail', {})
              service = detail.get('service')
              resource_type = detail.get('resource-type')
              tags = detail.get('tags', {})

              if service != 'ec2' or resource_type != 'instance':
                  raise Exception(f'Unsupported tag-change event: service={service}, resource-type={resource_type}')

              if tags.get('Forensic') != 'True':
                  print(f"Ignoring event because Forensic tag is not True: {tags.get('Forensic')}")
                  return {'statusCode': 200, 'ignored': True}

              resources = event.get('resources', [])
              if not resources:
                  raise Exception('Missing resources[] in Tag Change on Resource event')

              resource_arn = resources[0]
              match = re.search(r':instance/(i-[A-Za-z0-9]+)$', resource_arn)
              if not match:
                  raise Exception(f'Could not extract EC2 instance ID from ARN: {resource_arn}')

              instance_id = match.group(1)

              print(f'TARGET_INSTANCE_ID: {instance_id}')
              print(f'CLUSTER: {CLUSTER_NAME}')
              print(f'TASK DEFINITION: {TASK_DEFINITION}')
              print(f'SUBNET: {SUBNET_ID}')
              print(f'SECURITY GROUP: {SECURITY_GROUP_ID}')
              print('Launching Fargate task...')

              response = ecs.run_task(
                  cluster=CLUSTER_NAME,
                  taskDefinition=TASK_DEFINITION,
                  launchType='FARGATE',
                  count=1,
                  platformVersion='LATEST',
                  networkConfiguration={
                      'awsvpcConfiguration': {
                          'subnets': [SUBNET_ID],
                          'securityGroups': [SECURITY_GROUP_ID],
                          'assignPublicIp': 'ENABLED'
                      }
                  },
                  overrides={
                      'containerOverrides': [
                          {
                              'name': 'forensic-controller',
                              'environment': [
                                  {'name': 'TARGET_INSTANCE_ID', 'value': instance_id},
                                  {'name': 'OPERATION_MODE', 'value': 'LIVE_ACQUISITION'}
                              ]
                          }
                      ]
                  }
              )

              failures = response.get('failures', [])
              if failures:
                  print('================================================')
                  print('ECS RUN_TASK FAILED')
                  print('================================================')
                  print(json.dumps(failures, indent=2, default=str))
                  raise Exception(f'ECS RunTask failed: {failures}')

              tasks = response.get('tasks', [])
              if not tasks:
                  raise Exception('ECS RunTask returned no tasks and no failures')

              print('================================================')
              print('ECS TASK CREATED')
              print('================================================')
              for task in tasks:
                  print(json.dumps({
                      'taskArn': task.get('taskArn'),
                      'lastStatus': task.get('lastStatus'),
                      'desiredStatus': task.get('desiredStatus'),
                      'clusterArn': task.get('clusterArn')
                  }, indent=2))

              return {
                  'statusCode': 200,
                  'instance_id': instance_id,
                  'tasks': [task.get('taskArn') for task in tasks]
              }

  ForensicEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-ForensicTrigger'
      Description: !Sub 'Launch ${ProjectName} forensic acquisition when an EC2 instance has Forensic=True.'
      State: ENABLED
      EventPattern:
        source:
          - aws.tag
        detail-type:
          - Tag Change on Resource
        detail:
          service:
            - ec2
          resource-type:
            - instance
          changed-tag-keys:
            - Forensic
          tags:
            Forensic:
              - 'True'
      Targets:
        - Id: C-FAK-Orchestrator
          Arn: !GetAtt OrchestratorLambda.Arn

  AllowEventBridgeInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrchestratorLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ForensicEventRule.Arn

Outputs:
  EvidenceBucketName:
    Description: C-FAK evidence bucket
    Value: !Ref EvidenceBucket

  EvidenceBucketArn:
    Description: C-FAK evidence bucket ARN
    Value: !GetAtt EvidenceBucket.Arn

  ECSCluster:
    Description: C-FAK ECS cluster
    Value: !Ref ForensicCluster

  ECSTaskDefinition:
    Description: C-FAK ECS task definition
    Value: !Ref ForensicTaskDefinition

  FargateTaskRoleArn:
    Description: IAM role used by C-FAK Fargate
    Value: !GetAtt FargateTaskRole.Arn

  FargateExecutionRoleArn:
    Description: IAM execution role used by ECS
    Value: !GetAtt FargateExecutionRole.Arn

  OrchestratorLambda:
    Description: Lambda responsible for launching Fargate
    Value: !Ref OrchestratorLambda

  EventBridgeRule:
    Description: EC2 tag change forensic trigger
    Value: !Ref ForensicEventRule

  VictimIAMRole:
    Description: External existing EC2 IAM role. C-FAK does not create, attach, replace or assume this role.
    Value: EXTERNAL-NOT-MANAGED-BY-CFAK
